<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>ADS-B Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; background: #0d1014; }
  .leaflet-popup-content { font-family: sans-serif; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map').setView([48.85, 2.35], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);
var markers = {};
function updateAircraft(list) {
  var seen = {};
  list.forEach(function(ac) {
    if (!ac.lat || !ac.lon) return;
    var id = ac.icao || ac.callsign || Math.random();
    seen[id] = true;
    var label = (ac.callsign || ac.icao || '?') + '<br>' +
                (ac.altitude ? ac.altitude + ' ft' : '');
    if (markers[id]) {
      markers[id].setLatLng([ac.lat, ac.lon]).setPopupContent(label);
    } else {
      markers[id] = L.marker([ac.lat, ac.lon]).addTo(map).bindPopup(label);
    }
  });
  Object.keys(markers).forEach(function(id) {
    if (!seen[id]) { map.removeLayer(markers[id]); delete markers[id]; }
  });
}
window.updateAircraft = updateAircraft;
</script>
</body>
</html>
